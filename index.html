<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Medidores de Agua</title>
<style>
  :root{
    --azul:#0b5cab;
    --azul-oscuro:#083d73;
    --fondo:#f2f5f8;
    --texto:#1c2733;
    --borde:#d7dee5;
    --verde:#1f8a4c;
    --verde-fondo:#e6f5ec;
    --rojo:#c0392b;
    --gris:#8a97a3;
    --naranja:#e08a1e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--fondo);
    color:var(--texto);
  }
  header{
    background:var(--azul);
    color:#fff;
    padding:16px 16px 0;
    position:sticky;
    top:0;
    z-index:10;
  }
  header h1{font-size:17px;margin:0 0 12px;font-weight:600;}
  .tabs{
    display:flex;
    gap:4px;
  }
  .tab{
    flex:1;
    background:rgba(255,255,255,.12);
    border:none;
    color:#dce8f5;
    font-size:11px;
    font-weight:600;
    cursor:pointer;
    padding:9px 4px;
    border-radius:8px 8px 0 0;
  }
  .tab.activo{
    background:var(--fondo);
    color:var(--azul-oscuro);
  }
  /* Pestaña principal (Equipos Semanal) resaltada para diferenciarla del resto */
  .tab.tab-principal{
    background:var(--naranja);
    color:#fff;
    font-size:12px;
    font-weight:800;
  }
  .tab.tab-principal.activo{
    background:#fff;
    color:var(--naranja);
    box-shadow:inset 0 -3px 0 var(--naranja);
  }
  main{
    max-width:560px;
    margin:0 auto;
    padding:16px;
    padding-bottom:40px;
  }
  /* --- Selector de semana/fecha (desglosable) --- */
  .semana-box{
    background:#fff;
    border:1px solid var(--borde);
    border-radius:10px;
    margin-bottom:18px;
    overflow:hidden;
  }
  .semana-resumen{
    padding:14px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
  }
  .semana-resumen .txt{font-size:14.5px;}
  .semana-resumen .txt b{color:var(--azul-oscuro);}
  .semana-resumen .chev{color:var(--gris);font-size:13px;}
  .semana-detalle{
    display:none;
    padding:14px 16px 18px;
    border-top:1px solid var(--borde);
  }
  .semana-detalle.abierto{display:block;}
  .fila-campos{display:flex;gap:10px;margin-top:6px;}
  .fila-campos > div{flex:1;}
  label{font-size:12.5px;color:#5c6975;display:block;margin-bottom:4px;}
  .campo{
    background:#f7f9fb;
    border:1px solid var(--borde);
    border-radius:8px;
    padding:10px 12px;
    width:100%;
    font-size:15px;
  }
  select.campo{-webkit-appearance:none;appearance:none;}
  .btn-aplicar{
    margin-top:14px;
    width:100%;
    padding:11px;
    background:var(--azul);
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }
  .subtitulo{
    font-size:14px;
    color:#555;
    margin:0 0 10px 2px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .subtitulo-seccion{
    font-size:13px;
    font-weight:700;
    color:var(--azul-oscuro);
    text-transform:uppercase;
    letter-spacing:.03em;
    margin:0 0 10px 2px;
  }
  .link-actualizar{
    font-size:12.5px;
    color:var(--azul);
    cursor:pointer;
    font-weight:600;
    background:none;
    border:none;
    padding:0;
  }
  /* --- Acordeón de líneas --- */
  .linea-box{
    background:#fff;
    border:1px solid var(--borde);
    border-radius:10px;
    margin-bottom:10px;
    overflow:hidden;
  }
  .linea-header{
    padding:14px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
    gap:10px;
  }
  .linea-header .nombre{font-size:14px;}
  .linea-header .nombre .num{color:var(--azul-oscuro);font-weight:700;}
  .linea-header .der{display:flex;align-items:center;gap:8px;}
  .badge{
    font-size:11.5px;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    white-space:nowrap;
  }
  .badge.si{background:var(--verde-fondo);color:var(--verde);}
  .badge.no{background:#eef1f4;color:var(--gris);}
  .badge.cargando{background:#eef1f4;color:var(--gris);}
  .chev{color:var(--gris);font-size:13px;}
  .linea-cuerpo{
    display:none;
    padding:4px 16px 18px;
    border-top:1px solid var(--borde);
  }
  .linea-cuerpo.abierto{display:block;}
  .linea-cuerpo .campo{margin-top:10px;font-size:17px;}
  .mensaje-error{color:var(--rojo);font-size:13px;margin-top:8px;}
  .mensaje-ok{color:var(--verde);font-size:13px;margin-top:8px;font-weight:600;}
  .btn-guardar{
    width:100%;
    padding:12px;
    margin-top:12px;
    background:var(--verde);
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:14.5px;
    font-weight:700;
    cursor:pointer;
  }
  .btn-guardar[disabled]{opacity:.6;}
  /* --- Consumo: filtros y gráfico --- */
  .filtros-box{
    background:#fff;
    border:1px solid var(--borde);
    border-radius:10px;
    padding:14px 16px;
    margin-bottom:16px;
  }
  .filtros-fila{display:flex;gap:10px;margin-bottom:10px;}
  .filtros-fila:last-child{margin-bottom:0;}
  .filtros-fila > div{flex:1;}
  .grafico-box{
    background:#fff;
    border:1px solid var(--borde);
    border-radius:10px;
    padding:16px 12px;
    margin-bottom:16px;
  }
  .grafico-titulo{font-size:13.5px;color:#5c6975;margin:0 0 10px 4px;overflow:hidden;}
  .card{
    background:#fff;
    border:1px solid var(--borde);
    border-radius:10px;
    padding:14px 16px;
    margin-bottom:10px;
  }
  .card h3{margin:0 0 6px;font-size:15px;}
  .card p{margin:2px 0;font-size:13.5px;color:#3d4a56;}
  .consumo-valor{font-weight:700;color:var(--azul-oscuro);}
  .cargando, .vacio{
    text-align:center;
    color:#777;
    margin-top:40px;
    font-size:14px;
  }
  .spinner{
    width:28px;height:28px;
    border:3px solid #cdd8e2;
    border-top-color:var(--azul);
    border-radius:50%;
    margin:0 auto 10px;
    animation:girar .8s linear infinite;
  }
  @keyframes girar{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<header>
  <h1 id="tituloHeader">Medidores de Agua</h1>
  <div class="tabs">
    <button class="tab tab-principal" id="tabRegistro" onclick="irARegistro()">Equipos (Semanal)</button>
    <button class="tab" id="tabDiario" onclick="irADiario()">Planta (Diario)</button>
    <button class="tab" id="tabConsumo" onclick="irAAnalisis()">Análisis</button>
    <button class="tab" id="tabAgregar" onclick="irAAgregar()">Agregar línea</button>
  </div>
</header>
<main id="app"></main>
<script>
/* =========================================================
   CONFIGURACIÓN
   Reemplaza esta URL por la que te da Apps Script al
   implementar como "Aplicación web" (ver Code.gs).
========================================================= */
const BASE_URL = "https://script.google.com/macros/s/AKfycbwWNxjFm2FvnJk6YZAv19gI6N-_JOjAQRDa3vwzVjOYbpz_JZdbfROK3Iu-fleLXnw65A/exec";
// Líneas originales del Excel (Equipos, Semanal). Si el backend no tiene
// NINGUNA línea de este tipo todavía, las crea automáticamente con estos
// mismos números la primera vez que se abre.
const LINEAS_POR_DEFECTO = [
  { medidorNum: 1,  nombre: "SOLO DUCHA" },
  { medidorNum: 2,  nombre: "PAILAS COCCION + DUCHA" },
  { medidorNum: 3,  nombre: "LAVATINAS" },
  { medidorNum: 4,  nombre: "CALDERA" },
  { medidorNum: 5,  nombre: "EMBUTIDORAS" },
  { medidorNum: 6,  nombre: "PAILAS JAMONES" },
  { medidorNum: 7,  nombre: "ESPECIALIDADES" },
  { medidorNum: 8,  nombre: "PROD HIELO" },
  { medidorNum: 9,  nombre: "FILTRO1 + CLIMATIZADA + CUTTER" },
  { medidorNum: 10, nombre: "FORM CUTTER" },
  { medidorNum: 11, nombre: "FESSMAN" },
  { medidorNum: 12, nombre: "ATMOS MAURER" },
  { medidorNum: 13, nombre: "IMPIANTI 1" },
  { medidorNum: 14, nombre: "IMPIANTI 2" },
  { medidorNum: 15, nombre: "IMPIANTI 3" },
  { medidorNum: 16, nombre: "IMPIANTI 4" }
];
// Mediciones de Planta (Diario). Números propios (101, 102, ...) para no
// chocar con los medidores 1-16 de Equipos.
const LINEAS_DIARIO_POR_DEFECTO = [
  { medidorNum: 101, nombre: "Planta de Producción" },
  { medidorNum: 102, nombre: "Oficinas" }
];
const app = document.getElementById("app");
function formatearFechaDMA(fechaISO){
  // "2026-07-30" -> "30/07/2026"
  if (!fechaISO) return "";
  const partes = String(fechaISO).slice(0,10).split("-");
  if (partes.length !== 3) return fechaISO;
  return `${partes[2]}/${partes[1]}/${partes[0]}`;
}
function formatearMesDMA(mesISO){
  // "2026-07" -> "07/2026"
  if (!mesISO) return "";
  const partes = String(mesISO).split("-");
  if (partes.length !== 2) return mesISO;
  return `${partes[1]}/${partes[0]}`;
}
function getISOWeek(date){
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
}
/* =========================================================
   ESTADO GENERAL Y CACHÉ EN MEMORIA
========================================================= */
let vistaActual = "registro"; // "registro" | "diario" | "consumo" | "agregar"
// --- Equipos (Semanal) ---
let lineasGlobal = [];        // [{medidorNum, nombre}]
let sembrandoLineas = false;
let semanaActual = getISOWeek(new Date());
let fechaActual = new Date().toISOString().slice(0,10);
let lecturasSemana = {};
let cacheLecturasPorSemana = {};
let semanaAbierta = false;
let lineaAbierta = null;
let consumoGlobal = null;     // [{medidorNum, nombre, historial:[{semana,fecha,lectura,consumo}]}]
let filtroLinea = "";
let filtroTipo = "semana";    // "semana" | "mes"
let filtroValor = null;
let ordenGrafico = "desc";    // "desc" (mayor a menor) | "asc" (menor a mayor)
// --- Planta (Diario) ---
let lineasDiarioGlobal = [];        // [{medidorNum, nombre}]
let sembrandoLineasDiario = false;
let fechaDiarioActual = new Date().toISOString().slice(0,10);
let lecturasDiario = {};
let cacheLecturasPorFecha = {};
let fechaDiarioAbierta = false;
let lineaDiarioAbierta = null;
let consumoDiarioGlobal = null;     // [{medidorNum, nombre, historial:[{fecha,lectura,consumo}]}]
let filtroDiarioMedicion = "";      // "" = todas, o medidorNum
let filtroDiarioMes = null;         // "yyyy-mm"
function actualizarTabs(){
  document.getElementById("tabRegistro").classList.toggle("activo", vistaActual === "registro");
  document.getElementById("tabDiario").classList.toggle("activo", vistaActual === "diario");
  document.getElementById("tabConsumo").classList.toggle("activo", vistaActual === "consumo");
  document.getElementById("tabAgregar").classList.toggle("activo", vistaActual === "agregar");
}
async function obtenerLineasDesdeBackend(tipo){
  try{
    const resp = await fetch(`${BASE_URL}?action=lineas&tipo=${tipo}`);
    const data = await resp.json();
    return (data.ok && data.lineas) ? data.lineas : [];
  }catch(e){
    return [];
  }
}
async function cargarLineas(){
  lineasGlobal = await obtenerLineasDesdeBackend("semanal");
  if (!lineasGlobal.length && !sembrandoLineas){
    sembrandoLineas = true;
    for (const l of LINEAS_POR_DEFECTO){
      try{
        await fetch(BASE_URL, {
          method: "POST",
          body: JSON.stringify({ accion:"agregarLinea", tipo:"semanal", medidorNum: l.medidorNum, nombre: l.nombre })
        });
      }catch(e){ /* si una falla, seguimos con las demás */ }
    }
    lineasGlobal = await obtenerLineasDesdeBackend("semanal");
    sembrandoLineas = false;
  }
}
async function cargarLineasDiario(){
  lineasDiarioGlobal = await obtenerLineasDesdeBackend("diario");
  if (!lineasDiarioGlobal.length && !sembrandoLineasDiario){
    sembrandoLineasDiario = true;
    for (const l of LINEAS_DIARIO_POR_DEFECTO){
      try{
        await fetch(BASE_URL, {
          method: "POST",
          body: JSON.stringify({ accion:"agregarLinea", tipo:"diario", medidorNum: l.medidorNum, nombre: l.nombre })
        });
      }catch(e){ /* si una falla, seguimos con las demás */ }
    }
    lineasDiarioGlobal = await obtenerLineasDesdeBackend("diario");
    sembrandoLineasDiario = false;
  }
}
/* =========================================================
   NAVEGACIÓN
========================================================= */
async function irARegistro(){
  vistaActual = "registro";
  actualizarTabs();
  await renderRegistro();
}
async function irADiario(){
  vistaActual = "diario";
  actualizarTabs();
  await renderDiario();
}
async function irAAnalisis(){
  vistaActual = "consumo";
  actualizarTabs();
  await renderAnalisis();
}
function irAAgregar(){
  vistaActual = "agregar";
  actualizarTabs();
  renderAgregar();
}
/* =========================================================
   PANTALLA: Equipos (Semanal) — registrar lecturas
========================================================= */
async function renderRegistro(){
  if (!lineasGlobal.length){
    app.innerHTML = `<div class="cargando"><div class="spinner"></div>Cargando líneas...</div>`;
    await cargarLineas();
  }
  const yaEnCache = Object.prototype.hasOwnProperty.call(cacheLecturasPorSemana, semanaActual);
  lecturasSemana = yaEnCache ? cacheLecturasPorSemana[semanaActual] : {};
  app.innerHTML = `
    <div class="semana-box">
      <div class="semana-resumen" onclick="toggleSemana()">
        <div class="txt">Semana <b>${semanaActual}</b> — ${formatearFechaDMA(fechaActual)}</div>
        <div class="chev">${semanaAbierta ? "▲ cambiar" : "▼ cambiar"}</div>
      </div>
      <div class="semana-detalle ${semanaAbierta ? "abierto" : ""}">
        <div class="fila-campos">
          <div>
            <label>Número de semana</label>
            <input id="inputSemana" class="campo" type="number" min="1" max="53" value="${semanaActual}">
          </div>
          <div>
            <label>Fecha</label>
            <input id="inputFecha" class="campo" type="date" value="${fechaActual}">
          </div>
        </div>
        <button class="btn-aplicar" onclick="aplicarSemana()">Aplicar</button>
      </div>
    </div>
    <p class="subtitulo">
      <span>Líneas / medidores:</span>
      <button class="link-actualizar" onclick="refrescarSemanaActual()">↻ actualizar</button>
    </p>
    <div id="listaLineas"></div>
  `;
  renderListaLineas(!yaEnCache);
  if (!yaEnCache){
    await cargarLecturasSemana();
    cacheLecturasPorSemana[semanaActual] = lecturasSemana;
    renderListaLineas(false);
  }
}
function toggleSemana(){
  semanaAbierta = !semanaAbierta;
  renderRegistro();
}
async function aplicarSemana(){
  const nSemana = parseInt(document.getElementById("inputSemana").value, 10);
  const nFecha = document.getElementById("inputFecha").value;
  if (isNaN(nSemana) || nSemana < 1 || nSemana > 53){
    alert("Ingresa un número de semana válido (1-53).");
    return;
  }
  semanaActual = nSemana;
  fechaActual = nFecha || fechaActual;
  semanaAbierta = false;
  lineaAbierta = null;
  await renderRegistro();
}
async function refrescarSemanaActual(){
  delete cacheLecturasPorSemana[semanaActual];
  await renderRegistro();
}
async function cargarLecturasSemana(){
  try{
    const resp = await fetch(`${BASE_URL}?action=lecturas&tipo=semanal&semana=${semanaActual}`);
    const data = await resp.json();
    lecturasSemana = (data.ok && data.lecturas) ? data.lecturas : {};
  }catch(e){
    lecturasSemana = {};
  }
}
function renderListaLineas(cargandoEstado){
  const cont = document.getElementById("listaLineas");
  cont.innerHTML = "";
  if (!lineasGlobal.length){
    cont.innerHTML = `<div class="vacio">No se pudieron cargar las líneas. Revisa que BASE_URL apunte a tu Apps Script.</div>`;
    return;
  }
  lineasGlobal.forEach(l => {
    const medidorNum = l.medidorNum;
    const yaRegistrado = Object.prototype.hasOwnProperty.call(lecturasSemana, medidorNum);
    const valorActual = yaRegistrado ? lecturasSemana[medidorNum] : "";
    const abierto = lineaAbierta === medidorNum;
    let badgeClase = "no", badgeTexto = "Sin registrar";
    if (cargandoEstado){ badgeClase = "cargando"; badgeTexto = "..."; }
    else if (yaRegistrado){ badgeClase = "si"; badgeTexto = "Ya registrado"; }
    const box = document.createElement("div");
    box.className = "linea-box";
    box.innerHTML = `
      <div class="linea-header" onclick="toggleLinea(${medidorNum})">
        <span class="nombre"><span class="num">MEDIDOR ${medidorNum}</span> — ${l.nombre}</span>
        <span class="der">
          <span class="badge ${badgeClase}">${badgeTexto}</span>
          <span class="chev">${abierto ? "▲" : "▼"}</span>
        </span>
      </div>
      <div class="linea-cuerpo ${abierto ? "abierto" : ""}">
        <label>Lectura del medidor${yaRegistrado ? " (editar)" : ""}</label>
        <input class="campo input-lectura" type="number" inputmode="decimal" step="any"
               placeholder="Ej: 8607.09" value="${valorActual}">
        <div class="mensaje-error"></div>
        <button class="btn-guardar">${yaRegistrado ? "Actualizar lectura" : "Guardar lectura"}</button>
      </div>
    `;
    const btnGuardar = box.querySelector(".btn-guardar");
    btnGuardar.onclick = () => guardarLectura(medidorNum, box);
    cont.appendChild(box);
  });
}
function toggleLinea(medidorNum){
  lineaAbierta = (lineaAbierta === medidorNum) ? null : medidorNum;
  renderListaLineas(false);
}
async function guardarLectura(medidorNum, box){
  const input = box.querySelector(".input-lectura");
  const errorDiv = box.querySelector(".mensaje-error");
  const btn = box.querySelector(".btn-guardar");
  const valor = parseFloat(String(input.value).replace(",", "."));
  if (isNaN(valor)){
    errorDiv.textContent = "Ingresa un número válido.";
    return;
  }
  errorDiv.textContent = "";
  btn.disabled = true;
  const textoOriginal = btn.textContent;
  btn.textContent = "Guardando...";
  try{
    const resp = await fetch(BASE_URL, {
      method: "POST",
      body: JSON.stringify({ accion:"guardarLectura", tipo:"semanal", medidorNum, semana: semanaActual, fecha: fechaActual, lectura: valor })
    });
    const data = await resp.json();
    if (!data.ok) throw new Error(data.error || "Error desconocido");
    lecturasSemana[medidorNum] = valor;
    cacheLecturasPorSemana[semanaActual] = lecturasSemana;
    consumoGlobal = null; // los datos de consumo quedaron desactualizados
    lineaAbierta = null;
    renderListaLineas(false);
  }catch(e){
    btn.disabled = false;
    btn.textContent = textoOriginal;
    errorDiv.textContent = "No se pudo guardar: " + e.message;
  }
}
/* =========================================================
   PANTALLA: Planta (Diario) — registrar lecturas por día
========================================================= */
async function renderDiario(){
  if (!lineasDiarioGlobal.length){
    app.innerHTML = `<div class="cargando"><div class="spinner"></div>Cargando mediciones...</div>`;
    await cargarLineasDiario();
  }
  const yaEnCache = Object.prototype.hasOwnProperty.call(cacheLecturasPorFecha, fechaDiarioActual);
  lecturasDiario = yaEnCache ? cacheLecturasPorFecha[fechaDiarioActual] : {};
  app.innerHTML = `
    <div class="semana-box">
      <div class="semana-resumen" onclick="toggleFechaDiario()">
        <div class="txt">Fecha <b>${formatearFechaDMA(fechaDiarioActual)}</b></div>
        <div class="chev">${fechaDiarioAbierta ? "▲ cambiar" : "▼ cambiar"}</div>
      </div>
      <div class="semana-detalle ${fechaDiarioAbierta ? "abierto" : ""}">
        <label>Fecha</label>
        <input id="inputFechaDiario" class="campo" type="date" value="${fechaDiarioActual}">
        <button class="btn-aplicar" onclick="aplicarFechaDiario()">Aplicar</button>
      </div>
    </div>
    <p class="subtitulo">
      <span>Mediciones de planta:</span>
      <button class="link-actualizar" onclick="refrescarFechaDiario()">↻ actualizar</button>
    </p>
    <div id="listaDiario"></div>
  `;
  renderListaDiario(!yaEnCache);
  if (!yaEnCache){
    await cargarLecturasDiario();
    cacheLecturasPorFecha[fechaDiarioActual] = lecturasDiario;
    renderListaDiario(false);
  }
}
function toggleFechaDiario(){
  fechaDiarioAbierta = !fechaDiarioAbierta;
  renderDiario();
}
async function aplicarFechaDiario(){
  const nFecha = document.getElementById("inputFechaDiario").value;
  if (!nFecha){
    alert("Ingresa una fecha válida.");
    return;
  }
  fechaDiarioActual = nFecha;
  fechaDiarioAbierta = false;
  lineaDiarioAbierta = null;
  await renderDiario();
}
async function refrescarFechaDiario(){
  delete cacheLecturasPorFecha[fechaDiarioActual];
  await renderDiario();
}
async function cargarLecturasDiario(){
  try{
    const resp = await fetch(`${BASE_URL}?action=lecturas&tipo=diario&fecha=${fechaDiarioActual}`);
    const data = await resp.json();
    lecturasDiario = (data.ok && data.lecturas) ? data.lecturas : {};
  }catch(e){
    lecturasDiario = {};
  }
}
function renderListaDiario(cargandoEstado){
  const cont = document.getElementById("listaDiario");
  cont.innerHTML = "";
  if (!lineasDiarioGlobal.length){
    cont.innerHTML = `<div class="vacio">No se pudieron cargar las mediciones. Revisa que BASE_URL apunte a tu Apps Script.</div>`;
    return;
  }
  lineasDiarioGlobal.forEach(l => {
    const medidorNum = l.medidorNum;
    const yaRegistrado = Object.prototype.hasOwnProperty.call(lecturasDiario, medidorNum);
    const valorActual = yaRegistrado ? lecturasDiario[medidorNum] : "";
    const abierto = lineaDiarioAbierta === medidorNum;
    let badgeClase = "no", badgeTexto = "Sin registrar";
    if (cargandoEstado){ badgeClase = "cargando"; badgeTexto = "..."; }
    else if (yaRegistrado){ badgeClase = "si"; badgeTexto = "Ya registrado"; }
    const box = document.createElement("div");
    box.className = "linea-box";
    box.innerHTML = `
      <div class="linea-header" onclick="toggleLineaDiario(${medidorNum})">
        <span class="nombre">${l.nombre}</span>
        <span class="der">
          <span class="badge ${badgeClase}">${badgeTexto}</span>
          <span class="chev">${abierto ? "▲" : "▼"}</span>
        </span>
      </div>
      <div class="linea-cuerpo ${abierto ? "abierto" : ""}">
        <label>Lectura${yaRegistrado ? " (editar)" : ""}</label>
        <input class="campo input-lectura" type="number" inputmode="decimal" step="any"
               placeholder="Ej: 120.5" value="${valorActual}">
        <div class="mensaje-error"></div>
        <button class="btn-guardar">${yaRegistrado ? "Actualizar lectura" : "Guardar lectura"}</button>
      </div>
    `;
    const btnGuardar = box.querySelector(".btn-guardar");
    btnGuardar.onclick = () => guardarLecturaDiario(medidorNum, box);
    cont.appendChild(box);
  });
}
function toggleLineaDiario(medidorNum){
  lineaDiarioAbierta = (lineaDiarioAbierta === medidorNum) ? null : medidorNum;
  renderListaDiario(false);
}
async function guardarLecturaDiario(medidorNum, box){
  const input = box.querySelector(".input-lectura");
  const errorDiv = box.querySelector(".mensaje-error");
  const btn = box.querySelector(".btn-guardar");
  const valor = parseFloat(String(input.value).replace(",", "."));
  if (isNaN(valor)){
    errorDiv.textContent = "Ingresa un número válido.";
    return;
  }
  errorDiv.textContent = "";
  btn.disabled = true;
  const textoOriginal = btn.textContent;
  btn.textContent = "Guardando...";
  try{
    const resp = await fetch(BASE_URL, {
      method: "POST",
      body: JSON.stringify({ accion:"guardarLectura", tipo:"diario", medidorNum, fecha: fechaDiarioActual, lectura: valor })
    });
    const data = await resp.json();
    if (!data.ok) throw new Error(data.error || "Error desconocido");
    lecturasDiario[medidorNum] = valor;
    cacheLecturasPorFecha[fechaDiarioActual] = lecturasDiario;
    consumoDiarioGlobal = null;
    lineaDiarioAbierta = null;
    renderListaDiario(false);
  }catch(e){
    btn.disabled = false;
    btn.textContent = textoOriginal;
    errorDiv.textContent = "No se pudo guardar: " + e.message;
  }
}

async function guardarNuevaLinea(){
  const tipo = document.getElementById("selTipoAgregar").value;
  const inputNum = document.getElementById("inputNumMedidor");
  const inputNombre = document.getElementById("inputNuevaLinea");
  const errorDiv = document.getElementById("errorAgregar");
  const okDiv = document.getElementById("okAgregar");
  const nombre = inputNombre.value.trim();

  let medidorNum = null;
  if (tipo === "semanal"){
    medidorNum = parseInt(inputNum.value, 10);
    if (isNaN(medidorNum) || medidorNum <= 0){
      errorDiv.textContent = "Ingresa un número de medidor válido.";
      okDiv.textContent = "";
      return;
    }
  }
  if (!nombre){
    errorDiv.textContent = "Ingresa un nombre.";
    okDiv.textContent = "";
    return;
  }
  errorDiv.textContent = "";
  try{
    const body = { accion:"agregarLinea", tipo, nombre };
    if (tipo === "semanal") body.medidorNum = medidorNum;
    const resp = await fetch(BASE_URL, { method: "POST", body: JSON.stringify(body) });
    const data = await resp.json();
    if (!data.ok) throw new Error(data.error || "Error desconocido");
    if (tipo === "semanal"){
      lineasGlobal = await obtenerLineasDesdeBackend("semanal");
      consumoGlobal = null;
    }else{
      lineasDiarioGlobal = await obtenerLineasDesdeBackend("diario");
      consumoDiarioGlobal = null;
    }
    okDiv.textContent = `✓ Agregado como MEDIDOR ${data.medidorNum} — ${data.nombre}`;
    inputNum.value = "";
    inputNombre.value = "";
  }catch(e){
    okDiv.textContent = "";
    errorDiv.textContent = "No se pudo agregar: " + e.message;
  }
}
/* =========================================================
   PANTALLA: Análisis (Equipos Semanal + Planta Diario)
========================================================= */
async function renderAnalisis(){
  app.innerHTML = `<div class="cargando"><div class="spinner"></div>Cargando datos...</div>`;
  if (!lineasGlobal.length) await cargarLineas();
  if (consumoGlobal === null){
    try{
      const resp = await fetch(BASE_URL + "?action=consumo&tipo=semanal");
      const data = await resp.json();
      if (!data.ok) throw new Error(data.error || "Error desconocido");
      consumoGlobal = data.data;
    }catch(e){
      app.innerHTML = `<div class="mensaje-error" style="margin-top:40px;text-align:center;">No se pudo cargar: ${e.message}</div>`;
      return;
    }
  }
  if (!lineasDiarioGlobal.length) await cargarLineasDiario();
  if (consumoDiarioGlobal === null){
    try{
      const resp2 = await fetch(BASE_URL + "?action=consumo&tipo=diario");
      const data2 = await resp2.json();
      consumoDiarioGlobal = data2.ok ? data2.data : [];
    }catch(e){
      consumoDiarioGlobal = [];
    }
  }
  renderPantallaAnalisis();
}
async function refrescarAnalisis(){
  consumoGlobal = null;
  consumoDiarioGlobal = null;
  await renderAnalisis();
}
function renderPantallaAnalisis(){
  app.innerHTML = construirSeccionEquipos() + construirSeccionDiario();

  if (document.getElementById("selLinea")){
    const semanas = obtenerSemanasDisponibles();
    const meses = obtenerMesesDisponibles();
    document.getElementById("selLinea").onchange = (e) => {
      filtroLinea = e.target.value;
      dibujarGrafico();
      dibujarPareto();
    };
    document.getElementById("selTipo").onchange = (e) => {
      filtroTipo = e.target.value;
      filtroValor = filtroTipo === "semana" ? (semanas[0] || null) : (meses[0] || null);
      renderPantallaAnalisis();
    };
    document.getElementById("selValor").onchange = (e) => {
      filtroValor = filtroTipo === "semana" ? Number(e.target.value) : e.target.value;
      dibujarGrafico();
      dibujarPareto();
    };
    dibujarGrafico();
    dibujarPareto();
  }

  if (document.getElementById("selMedicionDiario")){
    document.getElementById("selMedicionDiario").onchange = (e) => {
      filtroDiarioMedicion = e.target.value;
      dibujarGraficoDiario();
    };
    document.getElementById("selMesDiario").onchange = (e) => {
      filtroDiarioMes = e.target.value;
      dibujarGraficoDiario();
    };
    dibujarGraficoDiario();
  }
}
/* --- Sección Equipos (Semanal): filtros + barras + Pareto --- */
function construirSeccionEquipos(){
  if (!consumoGlobal.length || consumoGlobal.every(l => !l.historial.length)) {
    return `
      <p class="subtitulo-seccion">Equipos (Semanal)</p>
      <div class="vacio" style="margin-bottom:26px;">Todavía no hay lecturas registradas.</div>
    `;
  }
  const semanas = obtenerSemanasDisponibles();
  const meses = obtenerMesesDisponibles();
  if (filtroValor === null){
    filtroValor = filtroTipo === "semana" ? (semanas[0] || null) : (meses[0] || null);
  }
  return `
    <p class="subtitulo-seccion">Equipos (Semanal)</p>
    <div class="filtros-box">
      <div class="filtros-fila">
        <div>
          <label>Línea / medidor</label>
          <select id="selLinea" class="campo">
            <option value="">Todas las líneas</option>
            ${lineasGlobal.map(l => `<option value="${l.medidorNum}" ${String(filtroLinea)===String(l.medidorNum)?"selected":""}>MEDIDOR ${l.medidorNum} — ${l.nombre}</option>`).join("")}
          </select>
        </div>
      </div>
      <div class="filtros-fila">
        <div>
          <label>Ver por</label>
          <select id="selTipo" class="campo">
            <option value="semana" ${filtroTipo==="semana"?"selected":""}>Semana</option>
            <option value="mes" ${filtroTipo==="mes"?"selected":""}>Mes</option>
          </select>
        </div>
        <div id="contValor">
          <label>${filtroTipo==="semana" ? "Semana" : "Mes"}</label>
          <select id="selValor" class="campo">
            ${filtroTipo==="semana"
              ? semanas.map(s => `<option value="${s}" ${filtroValor==s?"selected":""}>Semana ${s}</option>`).join("")
              : meses.map(m => `<option value="${m}" ${filtroValor===m?"selected":""}>${formatearMesDMA(m)}</option>`).join("")}
          </select>
        </div>
      </div>
    </div>
    <div class="grafico-box">
      <p class="grafico-titulo">
        <span id="graficoTitulo"></span>
        <span style="float:right;">
          <button id="btnOrden" class="link-actualizar" style="margin-right:12px;" onclick="toggleOrden()"></button>
          <button class="link-actualizar" onclick="refrescarAnalisis()">↻ actualizar</button>
        </span>
      </p>
      <div id="grafico"></div>
    </div>
    <div class="grafico-box" id="paretoBox">
      <p class="grafico-titulo" id="paretoTitulo"></p>
      <div id="graficoPareto"></div>
    </div>
  `;
}
async function toggleOrden(){
  ordenGrafico = ordenGrafico === "desc" ? "asc" : "desc";
  dibujarGrafico();
}
function obtenerSemanasDisponibles(){
  const set = new Set();
  consumoGlobal.forEach(l => l.historial.forEach(p => set.add(p.semana)));
  return Array.from(set).sort((a,b) => b - a);
}
function obtenerMesesDisponibles(){
  const set = new Set();
  consumoGlobal.forEach(l => l.historial.forEach(p => {
    if (p.consumo !== null && p.fecha) set.add(String(p.fecha).slice(0,7));
  }));
  return Array.from(set).sort().reverse();
}
function calcularDatosGrafico(){
  const items = [];
  if (filtroLinea === ""){
    consumoGlobal.forEach(l => {
      let valor = 0;
      l.historial.forEach(p => {
        if (p.consumo === null) return;
        if (filtroTipo === "semana"){
          if (p.semana === filtroValor) valor += p.consumo;
        }else{
          if (String(p.fecha).slice(0,7) === filtroValor) valor += p.consumo;
        }
      });
      items.push({ label: `M${l.medidorNum} ${l.nombre}`, valor: Number(valor.toFixed(2)) });
    });
    items.sort((a, b) => ordenGrafico === "desc" ? b.valor - a.valor : a.valor - b.valor);
  }else{
    const linea = consumoGlobal.find(l => String(l.medidorNum) === String(filtroLinea));
    if (!linea) return [];
    if (filtroTipo === "semana"){
      linea.historial.filter(p => p.consumo !== null).forEach(p => {
        items.push({ label: `Sem ${p.semana}`, valor: p.consumo });
      });
    }else{
      const porMes = {};
      linea.historial.filter(p => p.consumo !== null).forEach(p => {
        const mes = String(p.fecha).slice(0,7);
        porMes[mes] = (porMes[mes] || 0) + p.consumo;
      });
      Object.keys(porMes).sort().forEach(mes => {
        items.push({ label: formatearMesDMA(mes), valor: Number(porMes[mes].toFixed(2)) });
      });
    }
  }
  return items;
}
function dibujarGrafico(){
  const items = calcularDatosGrafico();
  const linea = filtroLinea === "" ? null : lineasGlobal.find(l => String(l.medidorNum) === String(filtroLinea));
  const tituloSpan = document.getElementById("graficoTitulo");
  const btnOrden = document.getElementById("btnOrden");
  if (filtroLinea === ""){
    tituloSpan.textContent = `Consumo por línea — ${filtroTipo === "semana" ? "Semana " + filtroValor : formatearMesDMA(filtroValor)} (eje Y: m³)`;
    btnOrden.style.display = "inline";
    btnOrden.textContent = ordenGrafico === "desc" ? "↓ mayor a menor" : "↑ menor a mayor";
  }else{
    tituloSpan.textContent = `Consumo de MEDIDOR ${linea ? linea.medidorNum : ""} — ${linea ? linea.nombre : ""} (eje Y: m³)`;
    btnOrden.style.display = "none";
  }
  renderBarChart(document.getElementById("grafico"), items);
}
function renderBarChart(container, items){
  if (!items.length){
    container.innerHTML = `<div class="vacio">No hay datos para este filtro.</div>`;
    return;
  }
  const max = Math.max(...items.map(i => i.valor), 1);
  const anchoBarra = 46;
  const espacio = 22;
  const alturaMax = 200;
  const anchoSvg = items.length * (anchoBarra + espacio) + espacio;
  const altoSvg = alturaMax + 110;
  let barrasSvg = "";
  items.forEach((item, idx) => {
    const x = espacio + idx * (anchoBarra + espacio);
    const alturaBarra = Math.max(2, (item.valor / max) * alturaMax);
    const y = alturaMax - alturaBarra + 20;
    const xCentro = x + anchoBarra / 2;
    const yEtiqueta = alturaMax + 26;
    barrasSvg += `
      <rect x="${x}" y="${y}" width="${anchoBarra}" height="${alturaBarra}" rx="4" fill="#0b5cab"></rect>
      <text x="${xCentro}" y="${y - 6}" text-anchor="middle" font-size="11" fill="#083d73" font-weight="700">${item.valor}</text>
      <text x="${xCentro}" y="${yEtiqueta}" text-anchor="end" font-size="10" fill="#5c6975" transform="rotate(-45 ${xCentro} ${yEtiqueta})">${item.label}</text>
    `;
  });
  container.innerHTML = `
    <div style="overflow-x:auto;">
      <svg width="${anchoSvg}" height="${altoSvg}" viewBox="0 0 ${anchoSvg} ${altoSvg}">
        <line x1="${espacio-6}" y1="${alturaMax+20}" x2="${anchoSvg-4}" y2="${alturaMax+20}" stroke="#d7dee5" />
        ${barrasSvg}
      </svg>
    </div>
  `;
}
/* --- Pareto (solo cuando se comparan "Todas las líneas") --- */
function dibujarPareto(){
  const box = document.getElementById("paretoBox");
  const titulo = document.getElementById("paretoTitulo");
  const cont = document.getElementById("graficoPareto");
  if (!box) return;
  if (filtroLinea !== ""){
    titulo.textContent = "Pareto de consumo";
    cont.innerHTML = `<div class="vacio">Selecciona "Todas las líneas" para ver el Pareto.</div>`;
    return;
  }
  const items = calcularDatosGrafico().slice().sort((a, b) => b.valor - a.valor);
  titulo.textContent = `Pareto 80/20 — ${filtroTipo === "semana" ? "Semana " + filtroValor : formatearMesDMA(filtroValor)}`;
  renderParetoChart(cont, items);
}
function renderParetoChart(container, items){
  if (!items.length){
    container.innerHTML = `<div class="vacio">No hay datos para este filtro.</div>`;
    return;
  }
  const total = items.reduce((s, i) => s + i.valor, 0) || 1;
  let acumulado = 0;
  const pct = items.map(i => { acumulado += i.valor; return Number((acumulado / total * 100).toFixed(1)); });

  const max = Math.max(...items.map(i => i.valor), 1);
  const anchoBarra = 46;
  const espacio = 22;
  const alturaMax = 200;
  const anchoSvg = items.length * (anchoBarra + espacio) + espacio;
  const altoSvg = alturaMax + 110;

  let barrasSvg = "";
  const puntosLinea = [];
  items.forEach((item, idx) => {
    const x = espacio + idx * (anchoBarra + espacio);
    const alturaBarra = Math.max(2, (item.valor / max) * alturaMax);
    const y = alturaMax - alturaBarra + 20;
    const xCentro = x + anchoBarra / 2;
    const yEtiqueta = alturaMax + 26;
    barrasSvg += `
      <rect x="${x}" y="${y}" width="${anchoBarra}" height="${alturaBarra}" rx="4" fill="#0b5cab"></rect>
      <text x="${xCentro}" y="${y - 6}" text-anchor="middle" font-size="10" fill="#083d73" font-weight="700">${item.valor}</text>
      <text x="${xCentro}" y="${yEtiqueta}" text-anchor="end" font-size="10" fill="#5c6975" transform="rotate(-45 ${xCentro} ${yEtiqueta})">${item.label}</text>
    `;
    const yPct = 20 + alturaMax - (pct[idx] / 100) * alturaMax;
    puntosLinea.push([xCentro, yPct]);
  });
  const yLinea80 = 20 + alturaMax - 0.8 * alturaMax;
  const lineaSvg = `
    <polyline points="${puntosLinea.map(p => p.join(",")).join(" ")}" fill="none" stroke="#e08a1e" stroke-width="2"></polyline>
    ${puntosLinea.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#e08a1e"></circle>`).join("")}
    <line x1="${espacio-6}" y1="${yLinea80}" x2="${anchoSvg-4}" y2="${yLinea80}" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="5,4"></line>
    <text x="${anchoSvg-6}" y="${yLinea80-4}" text-anchor="end" font-size="9" fill="#c0392b">80%</text>
  `;
  container.innerHTML = `
    <div style="overflow-x:auto;">
      <svg width="${anchoSvg}" height="${altoSvg}" viewBox="0 0 ${anchoSvg} ${altoSvg}">
        <line x1="${espacio-6}" y1="${alturaMax+20}" x2="${anchoSvg-4}" y2="${alturaMax+20}" stroke="#d7dee5" />
        ${barrasSvg}
        ${lineaSvg}
      </svg>
    </div>
    <div style="margin-top:8px;font-size:11.5px;color:#5c6975;">
      <span style="display:inline-flex;align-items:center;gap:5px;margin-right:14px;"><span style="width:10px;height:10px;background:#0b5cab;display:inline-block;border-radius:2px;"></span>Consumo (m³)</span>
      <span style="display:inline-flex;align-items:center;gap:5px;"><span style="width:10px;height:10px;background:#e08a1e;display:inline-block;border-radius:2px;"></span>% acumulado</span>
    </div>
  `;
}
/* --- Sección Planta (Diario): filtros + barras por día --- */

function obtenerMesesDisponiblesDiario(){
  const set = new Set();
  consumoDiarioGlobal.forEach(l => l.historial.forEach(p => {
    if (p.consumo !== null && p.fecha) set.add(String(p.fecha).slice(0,7));
  }));
  return Array.from(set).sort().reverse();
}
function dibujarGraficoDiario(){
  const titulo = document.getElementById("graficoDiarioTitulo");
  const cont = document.getElementById("graficoDiario");
  if (!titulo || !cont) return;
  const medicionesAMostrar = filtroDiarioMedicion === ""
    ? lineasDiarioGlobal
    : lineasDiarioGlobal.filter(l => String(l.medidorNum) === String(filtroDiarioMedicion));
  titulo.textContent = `Consumo diario — ${formatearMesDMA(filtroDiarioMes)} (m³)`;

  const fechasSet = new Set();
  const series = medicionesAMostrar.map(l => {
    const linea = consumoDiarioGlobal.find(c => c.medidorNum === l.medidorNum);
    const porFecha = {};
    (linea ? linea.historial : []).forEach(p => {
      if (p.consumo === null) return;
      if (String(p.fecha).slice(0,7) !== filtroDiarioMes) return;
      porFecha[p.fecha] = p.consumo;
      fechasSet.add(p.fecha);
    });
    return { nombre: l.nombre, porFecha };
  });
  const fechas = Array.from(fechasSet).sort();
  renderBarChartDiario(cont, fechas, series);
}
function renderBarChartDiario(container, fechas, series){
  if (!fechas.length || !series.length){
    container.innerHTML = `<div class="vacio">No hay datos para este filtro.</div>`;
    return;
  }
  const colores = ["#0b5cab", "#e08a1e", "#1f8a4c", "#8a97a3", "#c0392b"];
  const grupoAncho = series.length === 1 ? 40 : series.length * 18 + 6;
  const espacio = 20;
  const alturaMax = 200;
  const anchoSvg = fechas.length * (grupoAncho + espacio) + espacio;
  const altoSvg = alturaMax + 100;
  const max = Math.max(1, ...fechas.map(f => Math.max(...series.map(s => s.porFecha[f] || 0))));
  const anchoBarraIndiv = series.length === 1 ? grupoAncho : (grupoAncho - 6) / series.length;

  let barrasSvg = "";
  fechas.forEach((f, idx) => {
    const xGrupo = espacio + idx * (grupoAncho + espacio);
    series.forEach((s, si) => {
      const valor = s.porFecha[f] || 0;
      const x = xGrupo + si * (anchoBarraIndiv + (series.length > 1 ? 3 : 0));
      const alturaBarra = Math.max(1, (valor / max) * alturaMax);
      const y = alturaMax - alturaBarra + 20;
      barrasSvg += `<rect x="${x}" y="${y}" width="${anchoBarraIndiv}" height="${alturaBarra}" rx="3" fill="${colores[si % colores.length]}"></rect>`;
    });
    const xCentro = xGrupo + grupoAncho / 2;
    const yEtiqueta = alturaMax + 26;
    barrasSvg += `<text x="${xCentro}" y="${yEtiqueta}" text-anchor="end" font-size="9" fill="#5c6975" transform="rotate(-45 ${xCentro} ${yEtiqueta})">${formatearFechaDMA(f).slice(0,5)}</text>`;
  });
  const leyenda = series.length > 1 ? series.map((s, si) => `
    <span style="display:inline-flex;align-items:center;gap:5px;margin-right:14px;font-size:12px;color:#3d4a56;">
      <span style="width:10px;height:10px;border-radius:2px;background:${colores[si % colores.length]};display:inline-block;"></span>${s.nombre}
    </span>
  `).join("") : "";
  container.innerHTML = `
    <div style="overflow-x:auto;">
      <svg width="${anchoSvg}" height="${altoSvg}" viewBox="0 0 ${anchoSvg} ${altoSvg}">
        <line x1="${espacio-6}" y1="${alturaMax+20}" x2="${anchoSvg-4}" y2="${alturaMax+20}" stroke="#d7dee5" />
        ${barrasSvg}
      </svg>
    </div>
    ${leyenda ? `<div style="margin-top:8px;">${leyenda}</div>` : ""}
  `;
}

   ARRANQUE

actualizarTabs();
irARegistro();
